<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative Gery Robot Assistant interface</title>
  <desc id="desc">Fictional chat interface showing a cited troubleshooting procedure with step-by-step response choices. No internal documents or live data are shown.</desc>
  <defs>
    <linearGradient id="back" x1="0" y1="0" x2="1200" y2="720" gradientUnits="userSpaceOnUse"><stop stop-color="#0B1520"/><stop offset="1" stop-color="#172B35"/></linearGradient>
