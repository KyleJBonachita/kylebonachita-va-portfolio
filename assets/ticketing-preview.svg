<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative tech support ticketing dashboard</title>
  <desc id="desc">Fictional support queue with filters, three sample requests, and a request detail panel. It contains no real production data.</desc>
  <defs>
    <linearGradient id="back" x1="0" y1="0" x2="1200" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A151E"/>
      <stop offset="1" stop-color="#132635"/>
    </linearGradient>
    <linearGradient id="stage" x1="280" y1="110" x2="1020" y2="710" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1C3541"/>
      <stop offset="1" stop-color="#132431"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#A6E6D2"/>
      <stop offset="1" stop-color="#63C8C0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="19" stdDeviation="21" flood-color="#010B12" flood-opacity=".48"/></filter>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#9DD8CA" opacity=".12"/></pattern>
  </defs>

  <rect width="1200" height="720" fill="url(#back)"/>
  <rect width="1200" height="720" fill="url(#dots)"/>
  <circle cx="1070" cy="65" r="240" fill="#3B827D" opacity=".11"/>
  <circle cx="180" cy="665" r="240" fill="#245C6B" opacity=".17"/>

  <g filter="url(#shadow)">
    <rect x="59" y="48" width="1082" height="624" rx="20" fill="#11222D" stroke="#38515B" stroke-width="1.5"/>
    <path d="M79 48H1121C1132 48 1141 57 1141 68V102H59V68C59 57 68 48 79 48Z" fill="#182D38"/>
    <line x1="59" y1="102" x2="1141" y2="102" stroke="#36505A"/>
    <circle cx="86" cy="76" r="5" fill="#DF8F86"/><circle cx="104" cy="76" r="5" fill="#D2B780"/><circle cx="122" cy="76" r="5" fill="#8BC8B0"/>
    <rect x="463" y="64" width="270" height="24" rx="12" fill="#203743" stroke="#37505A"/>
    <circle cx="480" cy="75" r="5" fill="none" stroke="#86A7AA" stroke-width="1.5"/><path d="M484 79L489 84" stroke="#86A7AA" stroke-width="1.5"/>
    <text x="500" y="80" fill="#8DA9AC" font-family="Arial, sans-serif" font-size="10" letter-spacing="1.5">SEARCH REQUESTS</text>
    <circle cx="1103" cy="76" r="13" fill="#426D73"/><text x="1103" y="80" text-anchor="middle" fill="#DDF4E9" font-family="Arial, sans-serif" font-size="11" font-weight="700">K</text>
  </g>

