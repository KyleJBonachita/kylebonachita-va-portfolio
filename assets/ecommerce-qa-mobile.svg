<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 550" role="img" aria-labelledby="title desc">
  <title id="title">Sales and inventory record review summary for small screens</title>
  <desc id="desc">128,975 order lines. 7,795 missing amounts, mostly canceled. 12,807 zero quantities, mostly canceled. 6,617 of 7,195 sales SKUs found in the separate inventory list.</desc>
  <rect width="350" height="550" fill="#111a16"/>
  <text x="18" y="32" fill="#c6e79b" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="1.1">SALES DATA / REVIEW SUMMARY</text>
  <text x="18" y="67" fill="#f3f5ed" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">Filter incomplete lines.</text>
  <text x="18" y="98" fill="#f3f5ed" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">Review before deleting.</text>
  <path d="M18 118H332M18 239H332M18 330H332M18 421H332" stroke="#405044" stroke-width="1"/>

  <text x="18" y="146" fill="#c6e79b" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1">SALES FILE</text>
  <text x="18" y="199" fill="#f3f5ed" font-family="Arial, Helvetica, sans-serif" font-size="51" font-weight="700" letter-spacing="-2">128,975</text>
  <text x="18" y="224" fill="#aebdad" font-family="Arial, Helvetica, sans-serif" font-size="13">order lines  ·  120,378 distinct orders</text>

  <text x="18" y="270" fill="#f3f5ed" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Missing amount</text>
  <text x="332" y="270" fill="#f3f5ed" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="end">7,795</text>
  <text x="18" y="298" fill="#aebdad" font-family="Arial, Helvetica, sans-serif" font-size="13">7,566 canceled  ·  229 other</text>

  <text x="18" y="361" fill="#f3f5ed" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Zero quantity</text>
  <text x="332" y="361" fill="#f3f5ed" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="end">12,807</text>
  <text x="18" y="389" fill="#aebdad" font-family="Arial, Helvetica, sans-serif" font-size="13">12,701 canceled  ·  106 other</text>

  <text x="18" y="448" fill="#c6e79b" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1">SKU LIST COVERAGE</text>
  <text x="18" y="482" fill="#f3f5ed" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" letter-spacing="-.6">6,617 / 7,195</text>
  <rect x="18" y="495" width="314" height="12" fill="#3a4b3d"/>
  <rect x="18" y="495" width="289" height="12" fill="#c6e79b"/>
  <text x="18" y="529" fill="#aebdad" font-family="Arial, Helvetica, sans-serif" font-size="12">sales SKUs in separate inventory list</text>
</svg>
