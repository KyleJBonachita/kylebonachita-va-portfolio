<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img"><rect width="1200" height="720" fill="#0c2e27"/><circle cx="1150" cy="-30" r="290" fill="#91e3bc" opacity=".08"/><text x="70" y="53" fill="#91e3bc" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="3">PROCESS MAP / ILLUSTRATIVE</text><text x="70" y="105" fill="#fff" font-family="Arial,sans-serif" font-size="46" font-weight="700">Sales &amp; Inventory Record Review</text><rect x="70" y="207" width="515" height="178" rx="18" fill="#1c5041" stroke="#91e3bc" stroke-opacity=".42"/><text x="96" y="248" fill="#91e3bc" font-family="Arial,sans-serif" font-size="16" font-weight="700">STEP 01</text><text x="96" y="293" fill="#fff" font-family="Arial,sans-serif" font-size="25" font-weight="700">Confirm row type</text><text x="96" y="329" fill="#d9e4ef" font-family="Arial,sans-serif" font-size="17" font-weight="400">Treat each source row as a sales line, not a</text><text x="96" y="355" fill="#d9e4ef" font-family="Arial,sans-serif" font-size="17" font-weight="400">whole order.</text><rect x="615" y="207" width="515" height="178" rx="18" fill="#1c5041" stroke="#91e3bc" stroke-opacity=".42"/><text x="641" y="248" fill="#91e3bc" font-family="Arial,sans-serif" font-size="16" font-weight="700">STEP 02</text><text x="641" y="293" fill="#fff" font-family="Arial,sans-serif" font-size="25" font-weight="700">Filter missing data</text><text x="641" y="329" fill="#d9e4ef" font-family="Arial,sans-serif" font-size="17" font-weight="400">Review blank Amount and zero Qty with</text><text x="641" y="355" fill="#d9e4ef" font-family="Arial,sans-serif" font-size="17" font-weight="400">cancellation status.</text><rect x="70" y="414" width="515" height="178" rx="18" fill="#1c5041" stroke="#91e3bc" stroke-opacity=".42"/><text x="96" y="455" fill="#91e3bc" font-family="Arial,sans-serif" font-size="16" font-weight="700">STEP 03</text><text x="96" y="500" fill="#fff" font-family="Arial,sans-serif" font-size="25" font-weight="700">Review duplicates</text><text x="96" y="536" fill="#d9e4ef" font-family="Arial,sans-serif" font-size="17" font-weight="400">Separate valid multi-line orders from true</text><text x="96" y="562" fill="#d9e4ef" font-family="Arial,sans-serif" font-size="17" font-weight="400">removal candidates.</text><rect x="615" y="414" width="515" height="178" rx="18" fill="#1c5041" stroke="#91e3bc" stroke-opacity=".42"/><text x="641" y="455" fill="#91e3bc" font-family="Arial,sans-serif" font-size="16" font-weight="700">STEP 04</text><text x="641" y="500" fill="#fff" font-family="Arial,sans-serif" font-size="25" font-weight="700">Match product codes</text><text x="641" y="536" fill="#d9e4ef" font-family="Arial,sans-serif" font-size="17" font-weight="400">Compare sale SKUs with the separate</text><text x="641" y="562" fill="#d9e4ef" font-family="Arial,sans-serif" font-size="17" font-weight="400">inventory list and share safe counts.</text><text x="70" y="665" fill="#91e3bc" font-family="Arial,sans-serif" font-size="16">How the workflow is designed · no private records shown</text></svg>
