<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img"><rect width="1200" height="720" fill="#102442"/><circle cx="1150" cy="-30" r="290" fill="#a6c0ff" opacity=".08"/><text x="70" y="53" fill="#a6c0ff" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="3">PROCESS MAP / ILLUSTRATIVE</text><text x="70" y="105" fill="#fff" font-family="Arial,sans-serif" font-size="46" font-weight="700">Session Segregator</text><rect x="70" y="207" width="515" height="178" rx="18" fill="#273f68" stroke="#a6c0ff" stroke-opacity=".42"/><text x="96" y="248" fill="#a6c0ff" font-family="Arial,sans-serif" font-size="16" font-weight="700">STEP 01</text><text x="96" y="293" fill="#fff" font-family="Arial,sans-serif" font-size="25" font-weight="700">Choose task</text><text x="96" y="329" fill="#d9e4ef" font-family="Arial,sans-serif" font-size="17" font-weight="400">Select the session and review editable task</text><text x="96" y="355" fill="#d9e4ef" font-family="Arial,sans-serif" font-size="17" font-weight="400">instructions.</text><rect x="615" y="207" width="515" height="178" rx="18" fill="#273f68" stroke="#a6c0ff" stroke-opacity=".42"/><text x="641" y="248" fill="#a6c0ff" font-family="Arial,sans-serif" font-size="16" font-weight="700">STEP 02</text><text x="641" y="293" fill="#fff" font-family="Arial,sans-serif" font-size="25" font-weight="700">Read episodes</text><text x="641" y="329" fill="#d9e4ef" font-family="Arial,sans-serif" font-size="17" font-weight="400">Identify the session's sequence of episode</text><text x="641" y="355" fill="#d9e4ef" font-family="Arial,sans-serif" font-size="17" font-weight="400">folders.</text><rect x="70" y="414" width="515" height="178" rx="18" fill="#273f68" stroke="#a6c0ff" stroke-opacity=".42"/><text x="96" y="455" fill="#a6c0ff" font-family="Arial,sans-serif" font-size="16" font-weight="700">STEP 03</text><text x="96" y="500" fill="#fff" font-family="Arial,sans-serif" font-size="25" font-weight="700">Separate</text><text x="96" y="536" fill="#d9e4ef" font-family="Arial,sans-serif" font-size="17" font-weight="400">Route even episodes to LI1 and odd episodes</text><text x="96" y="562" fill="#d9e4ef" font-family="Arial,sans-serif" font-size="17" font-weight="400">to LI2.</text><rect x="615" y="414" width="515" height="178" rx="18" fill="#273f68" stroke="#a6c0ff" stroke-opacity=".42"/><text x="641" y="455" fill="#a6c0ff" font-family="Arial,sans-serif" font-size="16" font-weight="700">STEP 04</text><text x="641" y="500" fill="#fff" font-family="Arial,sans-serif" font-size="25" font-weight="700">Review output</text><text x="641" y="536" fill="#d9e4ef" font-family="Arial,sans-serif" font-size="17" font-weight="400">Apply the matching descriptions and inspect</text><text x="641" y="562" fill="#d9e4ef" font-family="Arial,sans-serif" font-size="17" font-weight="400">both outputs.</text><text x="70" y="665" fill="#a6c0ff" font-family="Arial,sans-serif" font-size="16">How the workflow is designed · no private records shown</text></svg>
