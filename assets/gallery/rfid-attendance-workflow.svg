<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img"><rect width="1200" height="720" fill="#2e1c2b"/><circle cx="1150" cy="-30" r="290" fill="#ffaf91" opacity=".08"/><text x="70" y="53" fill="#ffaf91" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="3">PROCESS MAP / ILLUSTRATIVE</text><text x="70" y="105" fill="#fff" font-family="Arial,sans-serif" font-size="46" font-weight="700">RFID Attendance Management</text><rect x="70" y="207" width="515" height="178" rx="18" fill="#553643" stroke="#ffaf91" stroke-opacity=".42"/><text x="96" y="248" fill="#ffaf91" font-family="Arial,sans-serif" font-size="16" font-weight="700">STEP 01</text><text x="96" y="293" fill="#fff" font-family="Arial,sans-serif" font-size="25" font-weight="700">Identify</text><text x="96" y="329" fill="#d9e4ef" font-family="Arial,sans-serif" font-size="17" font-weight="400">Read a registered RFID card at the device.</text><rect x="615" y="207" width="515" height="178" rx="18" fill="#553643" stroke="#ffaf91" stroke-opacity=".42"/><text x="641" y="248" fill="#ffaf91" font-family="Arial,sans-serif" font-size="16" font-weight="700">STEP 02</text><text x="641" y="293" fill="#fff" font-family="Arial,sans-serif" font-size="25" font-weight="700">Timestamp</text><text x="641" y="329" fill="#d9e4ef" font-family="Arial,sans-serif" font-size="17" font-weight="400">Create an attendance event with a time.</text><rect x="70" y="414" width="515" height="178" rx="18" fill="#553643" stroke="#ffaf91" stroke-opacity=".42"/><text x="96" y="455" fill="#ffaf91" font-family="Arial,sans-serif" font-size="16" font-weight="700">STEP 03</text><text x="96" y="500" fill="#fff" font-family="Arial,sans-serif" font-size="25" font-weight="700">Store</text><text x="96" y="536" fill="#d9e4ef" font-family="Arial,sans-serif" font-size="17" font-weight="400">Send the event to a central record store.</text><rect x="615" y="414" width="515" height="178" rx="18" fill="#553643" stroke="#ffaf91" stroke-opacity=".42"/><text x="641" y="455" fill="#ffaf91" font-family="Arial,sans-serif" font-size="16" font-weight="700">STEP 04</text><text x="641" y="500" fill="#fff" font-family="Arial,sans-serif" font-size="25" font-weight="700">Review</text><text x="641" y="536" fill="#d9e4ef" font-family="Arial,sans-serif" font-size="17" font-weight="400">Inspect attendance entries and exceptions.</text><text x="70" y="665" fill="#ffaf91" font-family="Arial,sans-serif" font-size="16">How the workflow is designed · no private records shown</text></svg>
